<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="920" height="470" rx="14" fill="#ffffff"/>
  <text x="460" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">一句话的完整执行流程</text>
  <text x="460" y="64" text-anchor="middle" font-size="13" fill="#64748b">以「打开美团，帮我找一下奶茶多少钱」为例，全程 5.2 秒</text>

  <!-- 时间轴 -->
  <line x1="60" y1="120" x2="860" y2="120" stroke="#cbd5e1" stroke-width="3"/>
  <g font-size="13" fill="#334155" text-anchor="middle">
    <circle cx="110" cy="120" r="9" fill="#0284c7"/>
    <circle cx="290" cy="120" r="9" fill="#16a34a"/>
    <circle cx="470" cy="120" r="9" fill="#ea580c"/>
    <circle cx="650" cy="120" r="9" fill="#ea580c"/>
    <circle cx="810" cy="120" r="9" fill="#7c3aed"/>
    <text x="110" y="95" font-weight="600">① 听清</text>
    <text x="290" y="95" font-weight="600">② 固件解析</text>
    <text x="470" y="95" font-weight="600">③ 打开美团</text>
    <text x="650" y="95" font-weight="600">④ 搜索奶茶</text>
    <text x="810" y="95" font-weight="600">⑤ 播报结果</text>
  </g>

  <!-- 步骤卡片 -->
  <g font-size="13">
    <rect x="40" y="150" width="150" height="150" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="115" y="185" text-anchor="middle" fill="#075985">唤醒词 + 语音</text>
    <text x="115" y="212" text-anchor="middle" fill="#075985">识别出整句文字</text>
    <text x="115" y="240" text-anchor="middle" font-size="11" fill="#0369a1">本地 STT 兜底 +</text>
    <text x="115" y="258" text-anchor="middle" font-size="11" fill="#0369a1">云端 tools/call 双路去重</text>

    <rect x="215" y="150" width="150" height="150" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="290" y="180" text-anchor="middle" fill="#14532d">phone_bridge</text>
    <text x="290" y="205" text-anchor="middle" fill="#14532d">拆出 App 名 + 搜索词</text>
    <text x="290" y="230" text-anchor="middle" font-size="11" fill="#166534">不写死任何 APP 名</text>
    <text x="290" y="248" text-anchor="middle" font-size="11" fill="#166534">应用名实时从桌面读取</text>

    <rect x="390" y="150" width="160" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="470" y="180" text-anchor="middle" fill="#7c2d12">回桌面 → 找到</text>
    <text x="470" y="205" text-anchor="middle" fill="#7c2d12">「美团」图标 → 点击</text>
    <text x="470" y="232" text-anchor="middle" font-size="11" fill="#9a3412">每步操作后回读</text>
    <text x="470" y="250" text-anchor="middle" font-size="11" fill="#9a3412">真实屏幕文字校验</text>

    <rect x="570" y="150" width="160" height="150" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
    <text x="650" y="180" text-anchor="middle" fill="#7c2d12">点「搜索」→ 输入</text>
    <text x="650" y="205" text-anchor="middle" fill="#7c2d12">「奶茶」→ 按搜索键</text>
    <text x="650" y="232" text-anchor="middle" font-size="11" fill="#9a3412">单次请求 17~37ms</text>
    <text x="650" y="250" text-anchor="middle" font-size="11" fill="#9a3412">（局域网 WiFi）</text>

    <rect x="750" y="150" width="130" height="150" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="815" y="180" text-anchor="middle" fill="#4c1d95">读回真实结果</text>
    <text x="815" y="207" text-anchor="middle" font-size="12" fill="#5b21b6">喜茶 18 元</text>
    <text x="815" y="228" text-anchor="middle" font-size="12" fill="#5b21b6">奈雪 22 元</text>
    <text x="815" y="249" text-anchor="middle" font-size="12" fill="#5b21b6">蜜雪冰城 7 元</text>
  </g>
  <g stroke="#475569" stroke-width="2">
    <line x1="190" y1="225" x2="213" y2="225" marker-end="url(#arr2)"/>
    <line x1="365" y1="225" x2="388" y2="225" marker-end="url(#arr2)"/>
    <line x1="550" y1="225" x2="568" y2="225" marker-end="url(#arr2)"/>
    <line x1="730" y1="225" x2="748" y2="225" marker-end="url(#arr2)"/>
  </g>

  <!-- 安全带 -->
  <rect x="60" y="330" width="800" height="112" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="460" y="362" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12">🔐 安全与合规红线（内置在固件里）</text>
  <text x="460" y="390" text-anchor="middle" font-size="13" fill="#854d0e">发消息 / 回复 / 下单 → 必须语音二次确认（「确认执行 + 8位码」），重放同一码会被拒绝</text>
  <text x="460" y="415" text-anchor="middle" font-size="13" fill="#854d0e">支付 / 密码 / 验证码 → 永不自动执行；无障碍读不到的自绘界面 → 如实说「读不到」，不编造</text>
</svg>
